; QUORUM firmware — two targets share one protocol library (lib/quorum_proto).
;
;   pio run -e agent   -t upload -t monitor     # search-agent firmware
;   pio run -e sniffer -t upload -t monitor     # RF sniffer firmware (added later)
;
; If your board isn't a plain WROOM-32 devkit, change `board` below. Common ones:
;   esp32dev            (most WROOM-32 devkits: DevKitC, NodeMCU-32S)
;   nodemcu-32s
;   esp32doit-devkit-v1

[platformio]
default_envs = agent

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; NOTE: the wire test (sim/wire_test.py) needs the serial port to itself.
; Don't run `-t monitor` at the same time as wire_test.py — only one program
; can own the port.

[env:agent]
build_src_filter = +<agent/>

[env:sniffer]
build_src_filter = +<sniffer/>
